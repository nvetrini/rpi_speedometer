# GPIO is required to read the reed switch / Hall sensor
CONFIG_GPIO=y

# Battery monitoring via ADC (enabled by default via Kconfig)
# ADC is implied by BATTERY_ENABLED

# Console output so we can see revolution/speed data over USB-UART
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
# CONFIG_SERIAL=y

# USB CDC-ACM for console over USB
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# SPI for SD card (enabled by SD_CARD_ENABLED config)
CONFIG_EMUL=y
CONFIG_HEAP_MEM_POOL_SIZE=256

# Settings subsystem for persistent storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Logging configuration
CONFIG_LOG=y
