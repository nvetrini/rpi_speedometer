# GPIO is required to read the reed switch / Hall sensor
CONFIG_GPIO=y

# ADC for battery voltage monitoring
CONFIG_ADC=y

# Console output so we can see revolution/speed data over USB-UART
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y

CONFIG_DISPLAY_ENABLED=y

# Display configs
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_EMUL=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_SSD1306=y

# Settings subsystem for persistent storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Config for SD access
CONFIG_SDHC=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

# Logging configuration
CONFIG_LOG=y
