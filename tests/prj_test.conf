# Test configuration for wheel sensor speedometer
# This file is used when running tests with twister

# Enable testing framework
CONFIG_TEST=y
CONFIG_ZTEST=y

# Enable all test modules
CONFIG_TEST_WHEEL_SENSOR=y
CONFIG_TEST_BATTERY=y
CONFIG_TEST_STORAGE=y
CONFIG_TEST_SD_CARD=y
CONFIG_TEST_SPEED_CALCULATOR=y
CONFIG_TEST_DISPLAY=y

# Use native_sim/native/64 board for testing
CONFIG_BOARD_NATIVE_SIM=y
CONFIG_X86_64=y

# Disable hardware-specific features for testing
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SPI=y

# Enable filesystem for SD card tests
CONFIG_FILE_SYSTEM=y
CONFIG_FS_FAT=y
CONFIG_DISK_DRIVERS=y

# Enable settings/NVS for storage tests
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Console output for test debugging
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Enable code coverage support
CONFIG_CODE_COVERAGE=y
CONFIG_CODE_COVERAGE_GCOV=y
CONFIG_CODE_COVERAGE_LOG_LEVEL_DBG=y

# Disable display for most tests (enable only for display tests)
# CONFIG_DISPLAY=n
# CONFIG_SSD1306=n
